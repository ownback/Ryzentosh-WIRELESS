name: PR labels
on:
  pull_request_target: {types: [opened, synchronize, reopened]}
permissions: {pull-requests: write, contents: read}
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const n = pr.additions + pr.deletions;
            const size = n < 10 ? 'XS' : n < 100 ? 'S' : n < 500 ? 'M' : n < 1500 ? 'L' : 'XL';
            const {data: f} = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: '.github/VOUCHED.td', ref: pr.base.ref}).catch(() => ({data: null}));
            const vouched = f ? Buffer.from(f.content, 'base64').toString().split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#')) : [];
            const labels = ['size:' + size, vouched.includes(pr.user.login) ? 'vouch:vouched' : 'vouch:unvouched'];
            const current = pr.labels.map(l => l.name).filter(l => !l.startsWith('size:') && !l.startsWith('vouch:'));
            await github.rest.issues.setLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, labels: current.concat(labels)});
